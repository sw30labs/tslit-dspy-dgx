[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tslit-dspy-dgx"
version = "0.2.0"
description = "TSLIT-DSPy on NVIDIA DGX Spark — DSPy integrity testing with non-adversary detection models"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [
    { name = "Nicolas Cravino" },
]
keywords = [
    "dspy",
    "llm-security",
    "backdoor-detection",
    "model-integrity",
    "tslit",
    "dgx",
    "ollama",
    "muse-glimmer",
]

dependencies = [
    "dspy==3.4.1",
    "optuna==5.0.0",
    "python-dotenv==1.2.4",
    "openai==3.45.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[project.scripts]
tslit = "tslit_dspy.cli:main"
tslit-dspy = "tslit_dspy.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["tslit_dspy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
