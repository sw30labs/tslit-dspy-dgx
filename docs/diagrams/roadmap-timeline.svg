      <text x="292" y="552" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">withdrawn</text>
      <circle cx="432" cy="548" r="6" fill="#eb6c36"/>
      <text x="448" y="552" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">this branch</text>
      <text x="640" y="552" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">break = Mar–Aug gap</text>
