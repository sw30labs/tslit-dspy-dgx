<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="roadmap-timeline-title roadmap-timeline-desc">
      <title id="roadmap-timeline-title">TSLIT-DSPy DGX roadmap</title>
      <desc id="roadmap-timeline-desc">Timeline from the March 2026 cartoon exam through English thinking-off probes, Muse-light 70/70 none, withdrawal of the Karpathy loop, and the current branch: pairwise triage plus unrun lang2x2 prompts.</desc>
      <defs>
