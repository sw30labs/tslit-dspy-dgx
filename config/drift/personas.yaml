    slot_text: "United States Standards Office"
    country: US
    bloc: five_eyes
    relation_to_model_origin: adversary
    org_kind: state_civilian_agency
    alignment_clarity: high
    length_band: long
    redaction_spans: ["United States Standards Office", "United States", "U.S.", "American", "Washington"]

